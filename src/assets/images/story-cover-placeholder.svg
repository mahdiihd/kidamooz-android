<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Story cover placeholder">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a1f4e"/>
      <stop offset="100%" stop-color="#120a24"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff4c9"/>
      <stop offset="55%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e8a838"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="96" cy="96" r="2" fill="#fff8e7" opacity="0.7"/>
  <circle cx="180" cy="64" r="1.5" fill="#fff8e7" opacity="0.55"/>
  <circle cx="420" cy="88" r="2" fill="#fff8e7" opacity="0.65"/>
  <circle cx="360" cy="140" r="1.2" fill="#fff8e7" opacity="0.5"/>
  <circle cx="256" cy="210" r="118" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="286" cy="188" r="96" fill="url(#sky)" opacity="0.92"/>
  <ellipse cx="220" cy="176" rx="18" ry="12" fill="#fff8e7" opacity="0.22"/>
  <ellipse cx="248" cy="248" rx="140" ry="28" fill="#ffd166" opacity="0.12"/>
</svg>
