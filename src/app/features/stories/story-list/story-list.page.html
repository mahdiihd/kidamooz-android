<app-stars-background></app-stars-background>

<div class="story-list-shell">
  <app-page-header
    [title]="'stories.playlistTitle' | translate"
    [showBack]="true"
    backHref="/tabs/home"
  ></app-page-header>

  @if (pageState() === 'loading') {
    <app-loading-moon></app-loading-moon>
  }

  @if (pageState() === 'error') {
    <app-error-state (retry)="loadStories()"></app-error-state>
  }

  @if (pageState() === 'ready') {
    @if (activeStory(); as current) {
      <div class="story-list-shell__player">
        <app-story-player-panel
          [story]="current"
          [playerState]="playerState()"
          [currentTime]="currentTime()"
          [duration]="duration() || current.durationSeconds"
          (playToggle)="onPlayToggle()"
          (skipBack)="onSkip(-10)"
          (skipForward)="onSkip(10)"
          (seek)="onSeek($event)"
        />
      </div>
    }

    <div class="story-list-shell__scroll">
      <div class="km-chip-row playlist-chips">
        <button
          type="button"
          class="km-chip"
          [class.active]="selectedCategoryId() === null"
          (click)="selectCategory(null)"
        >
          {{ 'stories.allCategories' | translate }}
        </button>
        @for (category of categories(); track category.id) {
          <button
            type="button"
            class="km-chip"
            [class.active]="selectedCategoryId() === category.id"
            (click)="selectCategory(category.id)"
          >
            {{ category | categoryTitle }}
          </button>
        }
      </div>

      @if (stories().length === 0) {
        <app-empty-state></app-empty-state>
      } @else {
        <div class="playlist-list">
          @for (story of stories(); track story.id) {
            <app-story-list-item
              [story]="story"
              [active]="isCurrentStory(story.id)"
              [playing]="isPlayingStory(story.id)"
              (selected)="onStorySelected($event)"
            />
          }
        </div>
      }
    </div>
  }
</div>
